name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system build dependencies for liboqs & SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libssl-dev build-essential git softhsm2

      - name: Build and install liboqs shared library
        run: |
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cmake -S /tmp/liboqs -B /tmp/liboqs/build -GNinja \
            -DBUILD_SHARED_LIBS=ON \
            -DOQS_USE_OPENSSL=ON \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo ninja -C /tmp/liboqs/build install
          sudo ldconfig

      - name: Install CPU-only PyTorch and Q-Aegis dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir build torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install --no-cache-dir -e ".[dev]"

      - name: Ruff lint & security check (Bandit S-rules)
        run: |
          ruff check src tests benchmarks
          ruff check --select S src

      - name: Ruff format check
        run: ruff format --check src tests benchmarks

      - name: Mypy strict static type check
        run: mypy --strict src

      - name: Pytest suite with >=90% coverage gate
        run: pytest --cov=qaegis --cov-fail-under=90 --cov-report=term-missing --cov-report=xml

      - name: Verify sdist and wheel package build
        run: python -m build --no-isolation --outdir dist/ && ls -lh dist/

      - name: Zero-placeholder repository audit
        run: |
          ! grep -rnE "\b(TODO|FIXME|NotImplementedError)\b|^\s*pass\s*$" src/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
