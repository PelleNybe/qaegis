name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation toolchain
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir mkdocs mkdocs-material mkdocstrings mkdocstrings-python

      - name: Build MkDocs strictly
        run: mkdocs build --strict
