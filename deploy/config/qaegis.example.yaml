# Q-Aegis Production Configuration Example
# Environment variables with prefix `QAEGIS_` and `__` nested delimiter override values below
# (e.g., QAEGIS_QUANTUM_DREAMER__BACKEND_TYPE=aer_noisy).

node_id: "qaegis-edge-01"
data_dir: "/var/lib/qaegis/data"
keys_dir: "/var/lib/qaegis/keys"
db_path: "/var/lib/qaegis/data/qaegis.db"

bus:
  # Use "inproc" for single-process edge daemons or "zmq" for multi-process IPC/TCP deployments
  transport: "inproc"
  zmq_pub_endpoint: "ipc:///run/qaegis/bus-pub.ipc"
  zmq_sub_endpoint: "ipc:///run/qaegis/bus-pub.ipc"
  zmq_bind_pub: true
  zmq_connect_sub: true
  # Set zmq_security to "curve" for Curve25519 encryption & ZAP peer allowlist authentication
  zmq_security: "none" # none | curve
  zmq_curve_key_dir: "/var/lib/qaegis/keys/curve"
  zmq_allowed_peer_keys: []
  zmq_server_public_key: null
  max_queue_size: 2048
  backpressure_policy: "block" # block | drop_oldest | reject
  request_timeout_s: 10.0

identity:
  primary_sig_alg: "ML-DSA-65"           # NIST FIPS 204
  fallback_sig_alg: "SLH-DSA-SHA2-128f"  # NIST FIPS 205 (stateless hash-based backup)
  kem_alg: "ML-KEM-768"                  # NIST FIPS 203
  rotation_interval_hours: 720
  # Hardware sealing backend for secret keys: none | pkcs11 | tpm2
  hardware_seal_backend: "none"
  pkcs11_library: null
  pkcs11_token_label: "qaegis"
  pkcs11_key_label: "qaegis-pqc-kek"
  tpm2_device: "/dev/tpmrm0"
  tpm2_pcr_spec: "sha256:0,7"

lifecycle:
  default_mode: "DAY"                    # DAY | NIGHT
  night_window_start_hour: 1             # UTC hour (0-23)
  night_window_end_hour: 5               # UTC hour (0-23)
  idle_cpu_threshold_pct: 25.0
  idle_duration_seconds: 300.0
  max_night_batch_size: 16

telemetry:
  enabled: true
  metrics_host: "127.0.0.1"
  metrics_port: 9108
  log_level: "INFO"                      # DEBUG | INFO | WARNING | ERROR | CRITICAL
  log_json: true

dashboard:
  enabled: false                         # Set true (or run `qaegis dashboard`) for Web UI
  host: "127.0.0.1"
  port: 8080
  auth_token: null                       # Or set QAEGIS_DASHBOARD_TOKEN env var
  sse_heartbeat_s: 10.0
  event_history_limit: 250

reality_stamp:
  # Optional network QRNG API URL (leave null to use local Qiskit Hadamard QRNG + Linux CSPRNG)
  qrng_http_url: null
  qrng_http_timeout_s: 3.0
  qiskit_qrng_qubits: 8
  entropy_sample_bytes: 128
  strict_nist_checks: true
  default_sig_alg: "ML-DSA-65"

chameleon_fw:
  anomaly_contamination: 0.05
  elevated_risk_threshold: 0.45
  critical_risk_threshold: 0.75
  rekey_after_messages: 100
  kem_alg: "ML-KEM-768"
  sig_alg: "ML-DSA-65"

qubit_compiler:
  default_num_qubits: 4
  encoder_hidden_dim: 32
  backend_noise_level: 0.01
  optimization_level: 2

quantum_dreamer:
  # Backends: aer_statevector | aer_noisy | ibm_runtime | aws_braket | ionq
  backend_type: "aer_statevector"
  ibm_backend_name: "ibm_brisbane"
  ibm_channel: "ibm_quantum"
  braket_device_arn: null
  ionq_target: "simulator"
  ionq_api_url: "https://api.ionq.co/v0.3/jobs"
  qaoa_reps: 2
  qaoa_shots: 1024
  max_optimizer_iters: 60
  min_policy_improvement: 0.01
  # Quantum Error Mitigation: none | zne | trex | both
  mitigation_mode: "none"
  zne_scale_factors: [1, 3, 5]
  zne_extrapolation: "richardson" # linear | richardson | exponential
  max_qpu_seconds_per_night: 300.0

quantum_entropy:
  harvester_qubits: 6
  harvester_shots: 512
  pool_min_bytes: 256
  ollama_base_url: "http://127.0.0.1:11434"
  ollama_model: "llama3.2"
  ollama_timeout_s: 30.0
