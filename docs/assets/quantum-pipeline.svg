<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 215" width="100%" role="img" aria-label="Q-Aegis Live Five-Subsystem Telemetry Pipeline">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070d19" />
      <stop offset="50%" stop-color="#0d182d" />
      <stop offset="100%" stop-color="#070d19" />
    </linearGradient>
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <path id="signalTrack" d="M 130 112 L 1070 112" />
  </defs>

  <rect x="2" y="2" width="1196" height="211" rx="16" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="34" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#67e8f9" letter-spacing="1.1">LIVE MICROKERNEL DATAFLOW  ·  SUB-10MS DAY MODE + FEDERATED NIGHT-MODE QAOA</text>

  <!-- Animated Conduit Track -->
  <use href="#signalTrack" stroke="#1e293b" stroke-width="4" fill="none" />
  <use href="#signalTrack" stroke="url(#flowLine)" stroke-width="2" stroke-dasharray="10 10" fill="none">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.4s" repeatCount="indefinite" />
  </use>

  <!-- Traveling Quantum Packets -->
  <circle r="5" fill="#22d3ee">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 130 112 L 1070 112" />
  </circle>
  <circle r="5" fill="#34d399">
    <animateMotion dur="4.2s" begin="1.4s" repeatCount="indefinite" path="M 130 112 L 1070 112" />
  </circle>
  <circle r="5" fill="#c4b5fd">
    <animateMotion dur="4.2s" begin="2.8s" repeatCount="indefinite" path="M 130 112 L 1070 112" />
  </circle>

  <!-- Stage 01 -->
  <g transform="translate(28, 54)">
