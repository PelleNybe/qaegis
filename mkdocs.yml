site_name: Q-Aegis Documentation
site_description: Quantum-Secured Autonomous Edge-AI Platform
site_url: https://pellenybe.github.io/qaegis/
repo_url: https://github.com/PelleNybe/qaegis
repo_name: PelleNybe/qaegis
copyright: Copyright &copy; 2026 Corax CoLAB &amp; Pelle (Apache-2.0)

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            docstring_style: google

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Cryptography & Threat Model: cryptography-threat-model.md
  - Quantum Backends: quantum-backends.md
  - Manuals:
      - Linux & ARM64 Installation: manuals/installation-linux-arm64.md
      - Operator's Manual: manuals/operators-manual.md
      - Developer Plugin Guide: manuals/developer-plugin-guide.md
      - Troubleshooting: manuals/troubleshooting.md
  - API Reference: api-reference.md
